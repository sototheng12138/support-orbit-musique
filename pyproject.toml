[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-orbit-musique"
version = "0.1.0"
description = "Auditable MuSiQue support-orbit construction, post-training, and evaluation"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.0",
  "numpy==2.4.6",
  "peft>=0.13",
  "scikit-learn==1.8.0",
  "torch>=2.4",
  "transformers==4.57.3",
]

[project.scripts]
build-support-orbit-musique = "support_orbit_musique.cli:main"
train-support-orbit-musique = "support_orbit_musique.train:main"
generate-support-orbit-musique = "support_orbit_musique.generate:main"

[tool.setuptools]
packages = ["support_orbit_musique"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor"]
